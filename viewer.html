<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Reflection · Digital Age Reflections</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           PDF VIEWER PAGE  ·  Digital Age Reflections
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #eef2f6;
            color: #1e2b3a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ---------- Header ---------- */

        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.85rem 1.4rem;
            background: linear-gradient(135deg, #1a3b4e, #2c5a6e);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 20, 30, 0.25);
            flex-wrap: wrap;
            z-index: 10;
        }

        .back-btn,
        .direct-btn,
        .close-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-weight: 500;
            font-size: 0.92rem;
            padding: 0.55rem 1.05rem;
            border-radius: 2rem;
            transition: background 0.2s, transform 0.15s;
            white-space: nowrap;
        }

        .back-btn:hover,
        .direct-btn:hover,
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .close-btn {
            width: 2.4rem;
            height: 2.4rem;
            padding: 0;
            border-radius: 50%;
            font-size: 1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .viewer-title {
            flex: 1;
            text-align: center;
            min-width: 150px;
        }

        .viewer-label {
            display: block;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.75;
            margin-bottom: 0.15rem;
        }

        .viewer-title h1 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* ---------- PDF area ---------- */

        .viewer-main {
            flex: 1;
            display: flex;
            padding: 1rem;
            min-height: 0;
            overflow: hidden;
            background: #eef2f6;
        }

        .pdf-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 1rem;
            background: #ffffff;
            box-shadow: 0 10px 32px -10px rgba(0, 20, 30, 0.25),
                        0 2px 6px rgba(0, 0, 0, 0.04);
        }

        /* ---------- Fallback note (shown if PDF cannot embed) ---------- */

        .pdf-fallback {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 32px -10px rgba(0, 20, 30, 0.25);
            padding: 2rem;
            text-align: center;
            color: #2d5a6e;
        }

        .pdf-fallback p {
            font-size: 1rem;
            line-height: 1.6;
        }

        .pdf-fallback a {
            display: inline-block;
            background: #2c5a6e;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 0.7rem 1.6rem;
            border-radius: 2rem;
            transition: background 0.2s, transform 0.15s;
        }

        .pdf-fallback a:hover {
            background: #1a3b4e;
            transform: translateY(-1px);
        }

        /* ---------- Focus states ---------- */

        .back-btn:focus-visible,
        .direct-btn:focus-visible,
        .close-btn:focus-visible {
            outline: 3px solid #a5d4e8;
            outline-offset: 2px;
        }

        /* ---------- Mobile ---------- */

        @media (max-width: 640px) {
            .viewer-header {
                padding: 0.65rem 0.85rem;
                gap: 0.5rem;
            }

            .back-btn,
            .direct-btn {
                padding: 0.45rem 0.75rem;
                font-size: 0.82rem;
            }

            .viewer-title h1 {
                font-size: 0.95rem;
            }

            .viewer-label {
                font-size: 0.62rem;
            }

            .viewer-main {
                padding: 0.5rem;
            }

            .pdf-frame {
                border-radius: 0.6rem;
            }
        }

        @media (max-width: 420px) {
            .direct-btn {
                display: none; /* keep header tidy on small screens */
            }
        }
    </style>
</head>
<body>

    <header class="viewer-header">
        <a href="index.html" class="back-btn" title="Return to index">
            ← Back to Index
        </a>

        <div class="viewer-title">
            <span class="viewer-label">Digital Age Reflections</span>
            <h1 id="student-title">Student Reflection</h1>
        </div>

        <div class="header-actions">
            <a id="direct-pdf"
               class="direct-btn"
               target="_blank"
               rel="noopener noreferrer"
               title="Open the PDF in its own tab">
                Open PDF ↗
            </a>
            <a href="index.html" class="close-btn" title="Close and return">✕</a>
        </div>
    </header>

    <main class="viewer-main">
        <iframe id="pdf-frame"
                class="pdf-frame"
                title="Student reflection PDF">
        </iframe>

        <!-- Shown only if the PDF cannot be embedded -->
        <div id="pdf-fallback" class="pdf-fallback">
            <p>⚠️ The PDF could not be displayed in this browser.</p>
            <a id="fallback-link" target="_blank" rel="noopener noreferrer">
                Open PDF in a new tab
            </a>
        </div>
    </main>

    <script>
        // Read ?student=NNNNN from the URL
        const params  = new URLSearchParams(window.location.search);
        const raw     = params.get('student') || '12345';

        // Validate: must be exactly 5 digits, otherwise fall back
        const student = /^\d{5}$/.test(raw) ? raw : '12345';

        const pdfFile = `${student}.pdf`;

        // Set page text + PDF source
        document.getElementById('student-title').textContent =
            `Student ${student} · Reflection`;
        document.getElementById('pdf-frame').src   = pdfFile;
        document.getElementById('direct-pdf').href = pdfFile;
        document.getElementById('fallback-link').href = pdfFile;
        document.title = `Student ${student} · Digital Age Reflections`;

        // Optional: if the PDF file is missing, show fallback instead of a blank frame
        fetch(pdfFile, { method: 'HEAD' })
            .then(res => {
                if (!res.ok) throw new Error('missing');
            })
            .catch(() => {
                document.getElementById('pdf-frame').style.display = 'none';
                document.getElementById('pdf-fallback').style.display = 'flex';
            });
    </script>

</body>
</html>
